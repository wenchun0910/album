        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

<body class="flex flex-col min-h-screen text-gray-800">

                <button type="button" onclick="closeModal('albumModal')" class="text-gray-400 hover:text-gray-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="albumForm" class="p-6 overflow-y-auto max-h-[70vh]">
                <input type="hidden" id="albumId">

                    <div>

    <!-- 確認刪除 Modal -->
    <div id="deleteModal" class="fixed inset-0 z-[70] hidden overflow-y-auto bg-black bg-opacity-50 flex items-center justify-center">

            </div>
            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-2">確認刪除</h3>
            <p class="text-sm text-gray-500 mb-6">您確定要刪除這筆資料嗎？此動作無法復原。</p>

    <script>
        // 設定 API 網址 (請換成您的 GAS 網頁應用程式 URL)
        const API_URL = "https://script.google.com/macros/s/AKfycbzSZO0CMwckh-ZDRgUFGhT9OgTUmBa8nRtDi4fYhpfzPsPdlwQL8O0IeCxJDKuBqYzC6Q/exec"; 
        let isMockMode = (API_URL === "https://script.google.com/macros/s/AKfycbzSZO0CMwckh-ZDRgUFGhT9OgTUmBa8nRtDi4fYhpfzPsPdlwQL8O0IeCxJDKuBqYzC6Q/exec" || !API_URL);

        let state = {
            albums: [],
            users: [],
            currentUser: null,
            deleteTarget: { type: null, id: null }
        };

        // 假資料
        let mockData = {
            albums: [
                { id: "a1", title: "11501樂樂棒球", date: "2026-01-18", description: "樂樂棒球比賽", coverImage: "https://images.unsplash.com/photo-1508344928928-7165b67de128?q=80&w=800&auto=format&fit=crop", driveLink: "#" }
            ],
            users: [
                { id: "u1", username: "admin", password: "123", createdAt: "2026-01-01" }
            ]
        };

        // ================= 核心工具：圖片轉換與日期格式化 =================

        /**
         * 將任意格式的日期轉換為 YYYY-MM-DD
         * 解決：GAS 回傳 2026-01-18T16:00:00.000Z 的問題
         */
        function formatCleanDate(dateStr) {
            if (!dateStr) return '';
            try {
                // 如果已經是純日期格式就跳過
                if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
                
                // 處理 ISO 時間字串
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr.split('T')[0]; // 若無法解析，暴力切斷 T
                
                // 使用本地時區轉出 YYYY-MM-DD
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            } catch (error) {
                return dateStr;
            }
        }

        /**
         * 將 Google Drive 共享連結轉為 <img> 標籤可用的直連網址
         */
        function getDirectImageUrl(url) {
            if (!url) return 'https://via.placeholder.com/800x600?text=No+Image';
            
            // 如果不是雲端硬碟網址，直接回傳原網址 (支援 Unsplash 等圖床)
            if (!url.includes('drive.google.com')) return url;
            
            let id = '';
            // 嘗試解析格式 1: /file/d/ID/view
            const match1 = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match1) id = match1[1];
            
            // 嘗試解析格式 2: ?id=ID
            const match2 = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (!id && match2) id = match2[1];

            // 將解析出的 ID 轉為直連網址
            if (id) {
                return `https://drive.google.com/uc?id=${id}`;
            }
            return url;
        }

        // 圖片預覽功能：當輸入框內容改變時觸發
        document.getElementById('albumCover').addEventListener('input', function(e) {
            const previewImg = document.getElementById('albumCoverPreview');
            const placeholderText = document.getElementById('albumCoverPlaceholder');
            const url = e.target.value.trim();
            
            if(url) {
                // 套用雲端硬碟轉換邏輯
                const directUrl = getDirectImageUrl(url);
                previewImg.src = directUrl;
                previewImg.classList.remove('hidden');
                placeholderText.classList.add('hidden');
            } else {
                previewImg.classList.add('hidden');
                placeholderText.classList.remove('hidden');
            }
        });


        // ================= 生命週期與 API =================

        window.addEventListener('DOMContentLoaded', async () => {
            const savedUser = sessionStorage.getItem('currentUser');
            if (savedUser) {
                state.currentUser = JSON.parse(savedUser);
                updateNavUI();
            }
            await loadData();
        });

        async function loadData() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('albumGrid').classList.add('hidden');
            try {
                const res = await apiCall('getData');
                state.albums = res.albums || [];
                state.users = res.users || [];
                renderPublicAlbums(state.albums);
                
                if(!document.getElementById('adminView').classList.contains('hidden')){
                    renderAdminAlbums();
                    renderAdminUsers();
                }
            } catch (error) {
                document.getElementById('noResults').classList.remove('hidden');
            } finally {
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        async function apiCall(action, payload = {}) {
            if (isMockMode) return handleMockApi(action, payload);
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...payload })
                });
                const result = await response.json();
                if(!result.success) throw new Error(result.message || 'API 錯誤');
                return result;
            } catch (error) {
                showToast(error.message || "網路連線錯誤", "error");
                throw error;
            }
        }

        // Mock API 省略實作細節，與之前相同
        async function handleMockApi(action, payload) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    switch(action) {
                        case 'login':
                            const user = mockData.users.find(u => u.username === payload.username && u.password === payload.password);
                            if (user) resolve({ success: true, user: { username: user.username } });
                            else reject(new Error("帳號或密碼錯誤"));
                            break;
                        case 'getData': resolve({ success: true, albums: mockData.albums, users: mockData.users }); break;
                        case 'saveAlbum':
                            if (payload.id) {
                                const idx = mockData.albums.findIndex(a => a.id === payload.id);
                                if(idx > -1) mockData.albums[idx] = { ...payload };
                            } else { mockData.albums.unshift({ ...payload, id: 'a' + Date.now() }); }
                            resolve({ success: true }); break;
                        case 'deleteAlbum': mockData.albums = mockData.albums.filter(a => a.id !== payload.id); resolve({ success: true }); break;
                        case 'saveUser':
                            if (payload.id) {
                                const idx = mockData.users.findIndex(u => u.id === payload.id);
                                if(idx > -1) mockData.users[idx] = { ...payload, createdAt: mockData.users[idx].createdAt };
                            } else { mockData.users.push({ ...payload, id: 'u' + Date.now(), createdAt: new Date().toISOString().split('T')[0] }); }
                            resolve({ success: true }); break;
                        case 'deleteUser': mockData.users = mockData.users.filter(u => u.id !== payload.id); resolve({ success: true }); break;
                        default: reject(new Error("未知的動作"));
                    }
                }, 400);
            });
        }


        // ================= 前台渲染邏輯 =================

        function renderPublicAlbums(albumsToRender) {
            const grid = document.getElementById('albumGrid');
            const noRes = document.getElementById('noResults');
            grid.innerHTML = '';

            if (!albumsToRender || albumsToRender.length === 0) {
                grid.classList.add('hidden');
                noRes.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            noRes.classList.add('hidden');

            albumsToRender.forEach(album => {
                // 套用清洗邏輯：乾淨的日期與直連圖片網址
                const cleanDate = formatCleanDate(album.date);
                const directImageUrl = getDirectImageUrl(album.coverImage);

                grid.insertAdjacentHTML('beforeend', `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden card-hover border border-gray-100 flex flex-col h-full">
                        <div class="relative h-48 w-full overflow-hidden bg-gray-200 skeleton">
                            <img src="${directImageUrl}" alt="${album.title}" 
                                 class="w-full h-full object-cover absolute top-0 left-0 transition-opacity duration-500 opacity-0"
                                 onload="this.classList.remove('opacity-0'); this.parentElement.classList.remove('skeleton');"
                                 onerror="this.src='https://via.placeholder.com/800x600?text=Image+Not+Found'; this.classList.remove('opacity-0');">
                            <div class="absolute top-0 right-0 bg-blue-600 text-white text-xs font-bold px-3 py-1 m-2 rounded-full shadow">
                                ${cleanDate}
                            </div>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <h3 class="text-xl font-bold text-gray-900 mb-2 line-clamp-1">${album.title}</h3>
                            <p class="text-gray-600 text-sm mb-4 line-clamp-3 flex-grow">${album.description || ''}</p>
                            <a href="${album.driveLink}" target="_blank" rel="noopener noreferrer" 
                               class="mt-auto w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-blue-700 bg-blue-100 hover:bg-blue-200 transition-colors">
                                <i class="fa-brands fa-google-drive mr-2 text-lg"></i> 開啟雲端相簿
                            </a>
                        </div>
                    </div>
                `);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = state.albums.filter(a => 
                (a.title||'').toLowerCase().includes(term) || 
                (formatCleanDate(a.date)).includes(term) || 
                (a.description||'').toLowerCase().includes(term)
            );
            renderPublicAlbums(filtered);
        });


        // ================= 後台渲染與 CRUD =================

        function renderAdminAlbums() {
            const tbody = document.getElementById('adminAlbumsTable');
            tbody.innerHTML = '';
            state.albums.forEach(album => {
                // 後台表格也套用清洗邏輯
                const cleanDate = formatCleanDate(album.date);
                const directImageUrl = getDirectImageUrl(album.coverImage);

                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap"><img src="${directImageUrl}" class="h-10 w-16 object-cover rounded shadow-sm border border-gray-200" onerror="this.src='https://via.placeholder.com/150'"></td>
                        <td class="px-6 py-4 whitespace-nowrap"><div class="text-sm font-medium text-gray-900">${album.title}</div></td>
                        <td class="px-6 py-4 whitespace-nowrap"><div class="text-sm text-gray-500">${cleanDate}</div></td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick='editAlbum(${JSON.stringify(album).replace(/'/g, "&#39;")})' class="text-indigo-600 hover:text-indigo-900 mr-3"><i class="fa-solid fa-pen-to-square"></i> 編輯</button>
                            <button onclick="confirmDelete('album', '${album.id}')" class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash"></i> 刪除</button>
                        </td>
                    </tr>
                `);
            });
        }

        function openAlbumModal(album = null) {
            const form = document.getElementById('albumForm');
            form.reset();
            
            // 重設預覽圖
            document.getElementById('albumCoverPreview').classList.add('hidden');
            document.getElementById('albumCoverPlaceholder').classList.remove('hidden');

            document.getElementById('albumId').value = '';
            document.getElementById('albumModalTitle').textContent = album ? '編輯相簿' : '新增相簿';
            
            if (album) {
                document.getElementById('albumId').value = album.id;
                document.getElementById('albumTitle').value = album.title;
                // 注意：賦值給 <input type="date"> 需要嚴格的 YYYY-MM-DD 格式
                document.getElementById('albumDate').value = formatCleanDate(album.date);
                document.getElementById('albumCover').value = album.coverImage;
                document.getElementById('albumLink').value = album.driveLink;
                document.getElementById('albumDesc').value = album.description;

                // 觸發一次預覽
                document.getElementById('albumCover').dispatchEvent(new Event('input'));
            }
            document.getElementById('albumModal').classList.remove('hidden');
        }

        function editAlbum(album) { openAlbumModal(album); }

        document.getElementById('albumForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const spinner = document.getElementById('albumFormSpinner');
            spinner.classList.remove('hidden');

            const payload = {
                id: document.getElementById('albumId').value,
                title: document.getElementById('albumTitle').value,
                date: document.getElementById('albumDate').value,
                coverImage: document.getElementById('albumCover').value,
                driveLink: document.getElementById('albumLink').value,
                description: document.getElementById('albumDesc').value
            };

            try {
                await apiCall('saveAlbum', payload);
                await loadData();
                closeModal('albumModal');
                showToast("相簿儲存成功！", "success");
            } catch (err) {} finally { spinner.classList.add('hidden'); }
        });

        // 帳號 CRUD 省略，功能完全一致
        function renderAdminUsers() {
            const tbody = document.getElementById('adminUsersTable');
            tbody.innerHTML = '';
            state.users.forEach(user => {
                const isMe = state.currentUser && state.currentUser.username === user.username;
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap"><div class="text-sm font-medium text-gray-900"><i class="fa-solid fa-user text-gray-400 mr-2"></i>${user.username}</div></td>
                        <td class="px-6 py-4 whitespace-nowrap"><div class="text-sm text-gray-500">${user.createdAt || '-'}</div></td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick='editUser(${JSON.stringify(user).replace(/'/g, "&#39;")})' class="text-indigo-600 hover:text-indigo-900 mr-3"><i class="fa-solid fa-pen-to-square"></i> 編輯</button>
                            ${isMe ? `<span class="text-gray-300 cursor-not-allowed"><i class="fa-solid fa-trash"></i> 刪除</span>` 
                                   : `<button onclick="confirmDelete('user', '${user.id}')" class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash"></i> 刪除</button>`}
                        </td>
                    </tr>
                `);
            });
        }
        function openUserModal(user = null) {
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            document.getElementById('userModalTitle').textContent = user ? '編輯帳號' : '新增帳號';
            if (user) {
                document.getElementById('userId').value = user.id;
                document.getElementById('userUsername').value = user.username;
                document.getElementById('userPassword').value = user.password;
            }
            document.getElementById('userModal').classList.remove('hidden');
        }
        function editUser(user) { openUserModal(user); }
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('userFormSpinner').classList.remove('hidden');
            try {
                await apiCall('saveUser', {
                    id: document.getElementById('userId').value,
                    username: document.getElementById('userUsername').value,
                    password: document.getElementById('userPassword').value
                });
                await loadData(); closeModal('userModal'); showToast("帳號儲存成功！", "success");
            } catch (err) { } finally { document.getElementById('userFormSpinner').classList.add('hidden'); }
        });

        // 登入登出與介面切換
        function showLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 登入中...'; btn.disabled = true;
            try {
                const res = await apiCall('login', { username: document.getElementById('loginUsername').value, password: document.getElementById('loginPassword').value });
                state.currentUser = res.user; sessionStorage.setItem('currentUser', JSON.stringify(res.user));
                updateNavUI(); closeModal('loginModal'); showToast("登入成功！", "success"); switchView('admin-albums');
            } catch (err) { } finally { btn.innerHTML = originalText; btn.disabled = false; }
        });
        function logout() { state.currentUser = null; sessionStorage.removeItem('currentUser'); updateNavUI(); switchView('public'); showToast("已登出", "success"); }
        function updateNavUI() {
            if (state.currentUser) {
                document.getElementById('navAdminBtn').classList.add('hidden');
                document.getElementById('navUserMenu').classList.remove('hidden');
                document.getElementById('navUsername').textContent = state.currentUser.username;
            } else {
                document.getElementById('navAdminBtn').classList.remove('hidden');
                document.getElementById('navUserMenu').classList.add('hidden');
            }
        }
        function switchView(viewName) {
            document.getElementById('publicView').classList.add('hidden');
            document.getElementById('adminView').classList.add('hidden');
            if (viewName === 'public') { document.getElementById('publicView').classList.remove('hidden'); renderPublicAlbums(state.albums); }
            else { document.getElementById('adminView').classList.remove('hidden'); renderAdminAlbums(); renderAdminUsers(); }
        }
        function switchAdminTab(tabName) {
            document.getElementById('adminAlbumsPanel').classList.add('hidden');
            document.getElementById('adminUsersPanel').classList.add('hidden');
            document.getElementById('tab-albums').className = "w-full text-left px-3 py-2 rounded-md font-medium text-gray-600 hover:bg-gray-50 flex items-center";
            document.getElementById('tab-users').className = "w-full text-left px-3 py-2 rounded-md font-medium text-gray-600 hover:bg-gray-50 flex items-center";
            if (tabName === 'albums') { document.getElementById('adminAlbumsPanel').classList.remove('hidden'); document.getElementById('tab-albums').classList.replace('text-gray-600', 'text-blue-700'); document.getElementById('tab-albums').classList.replace('hover:bg-gray-50', 'bg-blue-50'); }
            else { document.getElementById('adminUsersPanel').classList.remove('hidden'); document.getElementById('tab-users').classList.replace('text-gray-600', 'text-blue-700'); document.getElementById('tab-users').classList.replace('hover:bg-gray-50', 'bg-blue-50'); }
        }
        function confirmDelete(type, id) { state.deleteTarget = { type, id }; document.getElementById('deleteModal').classList.remove('hidden'); }
        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            document.getElementById('deleteSpinner').classList.remove('hidden');
            try {
                await apiCall(state.deleteTarget.type === 'album' ? 'deleteAlbum' : 'deleteUser', { id: state.deleteTarget.id });
                await loadData(); closeModal('deleteModal'); showToast("刪除成功！", "success");
            } catch (err) { } finally { document.getElementById('deleteSpinner').classList.add('hidden'); }
        });
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const iconBox = document.getElementById('toastIcon');
            document.getElementById('toastMessage').textContent = message;
            iconBox.className = "inline-flex items-center justify-center flex-shrink-0 w-8 h-8 rounded-lg";
            if (type === 'success') { iconBox.classList.add('text-green-500', 'bg-green-100'); iconBox.innerHTML = '<i class="fa-solid fa-check"></i>'; }
            else if (type === 'error') { iconBox.classList.add('text-red-500', 'bg-red-100'); iconBox.innerHTML = '<i class="fa-solid fa-xmark"></i>'; }
            else { iconBox.classList.add('text-blue-500', 'bg-blue-100'); iconBox.innerHTML = '<i class="fa-solid fa-info"></i>'; }
            toast.classList.remove('translate-x-full', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); }, 3000);
        }
    </script>
</body>
</html>
